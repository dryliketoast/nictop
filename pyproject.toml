[project]
name = "nictop"
version = "0.1.0"
description = "btop-style network interface traffic monitor with a tiling TUI"
requires-python = ">=3.13"
dependencies = [
    "psutil>=7.2.2",
    "textual>=8.2.8",
]

[project.scripts]
nictop = "nictop.__main__:main"
ebbflow = "nictop.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
]
